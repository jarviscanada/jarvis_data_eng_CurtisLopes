  - name: "Grep App"
    git_url: "/grep_app"
    description: Developed a Java-based Grep application - a command-line tool that recursively searches files in a directory
      for lines matching a given regular expression and writes results to an output file. Implemented both traditional (loop-based)
      and modern (Java Streams & Lambda) approaches. Built with Maven, logged with SL4FJ, and packaged using Docker for easy deployment.
      The application can be used for log analysis, automated file scanning, or integration into data-processing pipelines for DevOps and system monitoring tasks.
  #- name: "Springboot App"
  #  git_url: "/springboot"
  #  description: ""
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: Developed a proof-of-concept analytics project for a UK-based online retailer using Python, PostgreSQL,
      Docker, and Jupyter Notebook. Leveraged Pandas, Matplotlib, and Seaborn to analyze historical purchase data and visualize
      customer behaviour. Built an RFM (Recency, Frequency, Monetary) model to segment customers and uncover insights for targeted 
      marketing strategies. Deployed the project via GitHub and Jupyter Notebook to provide the LGS team with accessible analytics,
      allowing them to identify high-value customers, lapsed buyers for potential re-engagement, and improve overall sales performance.
