# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed a lightweight monitoring agent that uses Bash scripts to collect hardware specs and real-time
      resource usage from Linux hosts, storing the data in a centralized PostgreSQL database. Leverage tools such as psql, docker, 
      and crontab to automate data collection and ensure reliable scheduling. Emphasized modular scripting practices and relational 
      database design to support scalable infrastructure monitoring for system administrators and DevOps teams.
